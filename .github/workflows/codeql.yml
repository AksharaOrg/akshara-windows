name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 2'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
      - run: cmake --preset windows-x64
      - run: cmake --build --preset windows-x64
      - uses: github/codeql-action/analyze@v4
