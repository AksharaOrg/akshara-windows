name: Developer setup

on:
  push:
    tags: ['dev-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Numeric MAJOR.MINOR.PATCH version for the unsigned package
        required: false
        default: 0.1.0

permissions:
  contents: read

jobs:
  build-unsigned-setup:
    runs-on: windows-2022
    env:
      WIX_ACCEPT_EULA: ${{ vars.WIX_ACCEPT_EULA }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate WiX EULA acceptance
        shell: pwsh
        run: |
          if ($env:WIX_ACCEPT_EULA -ne 'wix7') {
            throw 'Set the repository variable WIX_ACCEPT_EULA to wix7 before packaging.'
          }
      - name: Build unsigned developer setup
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^dev-v', ''
          }
          ./tools/build-dev-setup.ps1 -Version $version -OutputDirectory dist/dev
      - name: Install and probe developer setup
        shell: pwsh
        run: |
          $bundle = (Get-ChildItem dist/dev/*-Setup.exe | Select-Object -First 1).FullName
          ./tools/verify-install.ps1 -Bundle $bundle
          ./tools/verify-install.ps1 -Bundle $bundle -Uninstall
      - name: Upload developer installer
        uses: actions/upload-artifact@v7
        with:
          name: Akshara-Windows-unsigned-${{ github.sha }}
          path: |
            dist/dev/Akshara-Windows-*-Setup.exe
            dist/dev/Akshara-Windows-*.msi
            dist/dev/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
